<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récapitulatif des résultats</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f6f3f4; color: #2c2c2c; margin: 0; padding: 20px; }
    .recap-container { max-width: 900px; margin: 20px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #830c2a; }
    .header-actions { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; }
    .header-actions h1 { margin: 0 0 5px 0; color: #830c2a; }
    .header-actions p { margin: 0; color: #666; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #f8fafc; padding: 25px 20px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card p { margin: 0; font-size: 28px; font-weight: bold; color: #830c2a; }
    .participant-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; transition: background 0.2s; }
    .participant-row:hover { background: #f9fafb; }
    .participant-name { font-weight: 600; }
    .participant-mode { color: #64748b; font-size: 0.9em; margin-left: 10px; }
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn { background: #830c2a; color: white; padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14px; transition: background 0.3s; display: inline-block; text-decoration: none; }
    .btn:hover { background: #6d0b24; }
    .btn-outline { background: white; color: #830c2a; border: 1px solid #830c2a; }
    .btn-outline:hover { background: #fff0f3; }
    
    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .recap-container { box-shadow: none; margin: 0; border: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="recap-container">
    <div class="header-actions">
      <div>
        <h1>Résultats : Salle <span id="roomCodeDisplay">...</span></h1>
        <p id="roomDateDisplay">Date : ...</p>
      </div>
      <div class="no-print" style="display: flex; gap: 10px;">
        <button onclick="window.print()" class="btn">📥 Exporter en PDF</button>
        <button id="exportCsvBtn" class="btn" style="background: #10b981;">📊 Exporter en CSV</button>
        <a href="dashboard-prof.html" class="btn btn-outline">Retour</a>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <!-- Rempli dynamiquement -->
    </div>

    <h2>Détail des participants</h2>
    <div id="participantsList" style="margin-top: 20px;">
      <p>Chargement des données...</p>
    </div>
  </div>
  <script type="module" src="recapitulatif.js"></script>
</body>
</html>
