<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion professeur</title>
    <link rel="stylesheet" href="identifprof.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Connexion professeur</h1>
        <p><em>Connectez-vous comme enseignant</em></p>
    </header>

    <!-- CONTENU -->
    <main class="container">
        <div class="card">
            <form>

                <label for="email">Mail institutionnel</label>
                <input
                    type="email"
                    id="email"
                    placeholder="prenom.nom@u-paris.fr"
                >

                <label for="matiere">Matière</label>
                <input
                    type="text"
                    id="matiere"
                    placeholder="Matière"
                >

                <a href="#" class="btn" id="loginBtn">Se connecter</a>

                <p class="error-message" id="loginError"></p>

                <p class="link">
                    Vous n’avez pas un compte ?
                    <a href="creesalle.html">Créer un compte</a>
                </p>

            </form>
        </div>
    </main>

    <script type="module" src="identifprof.js"></script>

</body>
</html>
