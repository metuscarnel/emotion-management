<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion professeur</title>
    <link rel="stylesheet" href="identifprof.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Connexion professeur</h1>
        <p><em>Connectez-vous comme enseignant</em></p>
    </header>

    <!-- CONTENU -->
    <main class="container">
        <div class="card">
            <form id="loginForm">

                <label for="email">Mail institutionnel</label>
                <input
                    type="email"
                    id="email"
                    placeholder="votre.email@ecole.fr"
                >

                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Votre mot de passe"
                >

                <button type="submit" class="btn" id="loginBtn" style="border:none; cursor:pointer; width: 100%; display: block; font: inherit; padding: 12px; margin-top: 15px;">Se connecter</button>

                <p class="error-message" id="loginError"></p>

                <p class="link">
                    Vous n’avez pas un compte ?
                    <a href="creesalle.html">Créer un compte</a>
                </p>

            </form>
        </div>
    </main>

    <script type="module" src="identifprof.js"></script>

</body>
</html>
