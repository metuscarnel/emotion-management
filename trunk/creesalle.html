<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription professeur</title>
  <link rel="stylesheet" href="creesalle.css">
</head>
<body>

  <div class="container">
    <h1>Inscription professeur</h1>
    <p class="subtitle"> <em>Créer un compte pour créer une salle</em></p>

    <form id="registerForm">
      <label>Nom</label>
      <input type="text" id="nom" placeholder="Nom">

      <label>Prénom</label>
      <input type="text" id="prenom" placeholder="Prénom">

      <label>Mail institutionnel</label>
      <input type="email" id="email" placeholder="votre.email@ecole.fr">

      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Votre mot de passe">

      <p class="error-message" id="errorMessage">
        ⚠️ Tous les champs doivent être remplis et le mail doit être valide.
      </p>

      <!-- Lien -->
      <button type="submit" class="btn" id="submitBtn" style="border:none; cursor:pointer; width: 100%; display: block; font: inherit; padding: 12px;">Créer un compte</button>

      <div class="bottom-link">
        Vous avez déjà un compte ?<br>
        <a href="identifprof.html">Connectez-vous →</a>
      </div>
    </form>
  </div>

  <script type="module" src="creesalle.js"></script>
</body>
</html>
